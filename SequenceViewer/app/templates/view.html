<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Sequences - {{ filename }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='genview.css') }}">
    <script src="https://unpkg.com/seqviz"></script>
    <style>
        .enzyme {
            color: black;
            border: 1px solid red;
            padding: 2px;
        }
        .sequence-container {
            background-color: #ffffff;
            border-radius: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Viewing Sequences from {{ filename }}</h1>
        <a href="{{ url_for('index') }}">View Another File</a>
        <hr>
        {% for record in sequences %}
        <div class="sequence-container">
            <div style="overflow: hidden;" id="seqviz-{{ record.id }}"></div>
            <script>
                window.seqviz.Viewer("seqviz-{{ record.id }}", {
                    name: "{{ record.id }}",
                    seq: "{{ record.sequence|safe }}",
                    style: { height: "65vh", width: "65vw", color: "white" },
                    highlights: [
                        {% for enzyme, start, end, color in record.features %}
                        { start: {{ start }}, end: {{ end }}, color: "{{ color }}" },
                        {% endfor %}
                    ],
                    enzymes: [
                        {% for enzyme in record.enzyme_objects %}
                        {
                            name: "{{ enzyme.name }}",
                            rseq: "{{ enzyme.rseq }}",
                            fcut: {{ enzyme.fcut }},
                            rcut: {{ enzyme.rcut }},
                            color: "{{ enzyme.color }}"
                        },
                        {% endfor %}
                    ],
                    viewer: "both_flip"
                }).render();
            </script>
            <hr>
        </div>
        {% endfor %}
    </div>
    <footer>
        <center>
            <img src="{{ url_for('static', filename='img/LFX-genofusionv.png') }}" alt="Logo" width="100px">
            <p id="footer-year">2024 &copy; Linear Fox, Sequences Viewer (open source under Apache License)</p>
            <script>
                document.getElementById("footer-year").textContent =
                    new Date().getFullYear() + " © Linear Fox, Sequences Viewer (open source under Apache License)";
            </script>
        </center>
    </footer>
</body>
</html>
